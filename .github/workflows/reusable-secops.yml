name: Reusable DevSecOps Security Gate

on:
  workflow_call:
    inputs:
      python_sast:
        description: "執行 Python 語法與 Bandit 靜態安全掃描"
        required: false
        type: boolean
        default: true
      node_audit:
        description: "執行 Node.js npm audit 供應鏈高危弱點掃描"
        required: false
        type: boolean
        default: false
      node_working_dir:
        description: "Node.js package-lock.json 所在子目錄"
        required: false
        type: string
        default: "."
      public_repo:
        description: "是否為公開儲存庫"
        required: false
        type: boolean
        default: false
      public_web_gate:
        description: "是否驗證公開網站 SEO/ads.txt 契約"
        required: false
        type: boolean
        default: false
      large_file_allowlist:
        description: "允許超過 5MB 之檔案路徑（逗號分隔）"
        required: false
        type: string
        default: ""
      test_command:
        description: "專案自動化測試指令"
        required: false
        type: string
        default: ""
      install_ffmpeg:
        description: "執行測試前是否安裝 ffmpeg（預設關閉，僅需音訊解碼測試之專案開啟）"
        required: false
        type: boolean
        default: false
      docker_scan:
        description: "是否建置 Dockerfile 並執行 Trivy library CRITICAL 套件弱點掃描與容器啟動／敏感路徑暴露黑盒測試"
        required: false
        type: boolean
        default: false
      docker_run_env:
        description: "Stage 3b 離線容器探測用測試環境變數（逗號分隔 KEY=VALUE，嚴禁傳真實機密）"
        required: false
        type: string
        default: ""
      docker_probe_path:
        description: "Stage 3b 容器啟動健康探測路徑（預設 /；自訂路徑如 /api/health 時嚴格要求 HTTP 200）"
        required: false
        type: string
        default: "/"
      docker_sensitive_paths:
        description: "Stage 3b 禁止對外暴露的敏感路徑清單（逗號分隔）"
        required: false
        type: string
        default: "/server.py,/.env,/Dockerfile"

permissions:
  contents: read

jobs:
  secops-gate:
    name: DevSecOps SAST / SCA / Secret & Container Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false

      - name: Checkout shared secops scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tbpfs/pm-secops-workflows
          path: _secops
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache pip downloads (Bandit & Python requirements)
        if: ${{ inputs.python_sast || inputs.test_command != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: secops-pip-v1-${{ runner.os }}-${{ hashFiles('caller/requirements.txt') || 'base' }}
          restore-keys: |
            secops-pip-v1-${{ runner.os }}-

      - name: Set up Node.js 24 (when needed)
        if: ${{ inputs.node_audit || contains(inputs.test_command, 'npm') || contains(inputs.test_command, 'node') }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache npm downloads (when needed)
        if: ${{ inputs.node_audit || contains(inputs.test_command, 'npm') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: secops-npm-v1-${{ runner.os }}-${{ hashFiles('caller/**/package-lock.json') || 'base' }}
          restore-keys: |
            secops-npm-v1-${{ runner.os }}-

      - name: Stage 1 — Secret, Path Leak & Workflow Supply-Chain Gate
        env:
          IS_PUB_REPO: ${{ inputs.public_repo && '1' || '0' }}
          ALLOW_LARGE: ${{ inputs.large_file_allowlist }}
        run: |
          EXTRA_FLAGS=()
          if [[ "${IS_PUB_REPO}" == "1" ]]; then EXTRA_FLAGS+=("--public-repo"); fi
          python3 _secops/scripts/pm_secops_gate.py \
            --repo-dir caller \
            --allow-large "${ALLOW_LARGE}" \
            "${EXTRA_FLAGS[@]}"

      - name: Stage 2a — Python SAST (Bandit High-Severity Check)
        if: ${{ inputs.python_sast }}
        run: |
          PY_FILES=$(git -C caller ls-files '*.py' || true)
          if [[ -n "${PY_FILES}" ]]; then
            pip install --quiet --disable-pip-version-check "bandit>=1.7.10"
            # Fail on HIGH severity + HIGH confidence issues (e.g. shell=True injection, weak crypto, unverified TLS)
            bandit -r caller -x caller/tests,caller/test,caller/.venv,caller/node_modules -lll -iii -q
            echo "[PASS] Python Bandit SAST check clean."
          fi

      - name: Stage 2b — Node.js Dependency Vulnerability Audit
        if: ${{ inputs.node_audit }}
        working-directory: caller/${{ inputs.node_working_dir }}
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
            npm audit --omit=dev --audit-level=critical
            echo "[PASS] npm production dependency audit clean."
          fi

      - name: Stage 3a — Run Project Verification / Unit Test Suite & Post-Build Web Contract
        if: ${{ inputs.test_command != '' || inputs.public_web_gate }}
        working-directory: caller
        env:
          TEST_CMD: ${{ inputs.test_command }}
          INSTALL_FFMPEG: ${{ inputs.install_ffmpeg && '1' || '0' }}
          IS_PUB_WEB: ${{ inputs.public_web_gate && '1' || '0' }}
          IS_PUB_REPO: ${{ inputs.public_repo && '1' || '0' }}
          ALLOW_LARGE: ${{ inputs.large_file_allowlist }}
        run: |
          if [[ -n "${TEST_CMD}" ]]; then
            if [[ "${INSTALL_FFMPEG}" == "1" ]] && ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
            fi
            if [[ -f requirements.txt ]]; then
              pip install --quiet --disable-pip-version-check -r requirements.txt
            fi
            bash -euo pipefail -c "${TEST_CMD}"
          fi
          if [[ "${IS_PUB_WEB}" == "1" ]]; then
            EXTRA_WEB=("--public-web")
            if [[ "${IS_PUB_REPO}" == "1" ]]; then EXTRA_WEB+=("--public-repo"); fi
            python3 ../_secops/scripts/pm_secops_gate.py \
              --repo-dir . \
              --allow-large "${ALLOW_LARGE}" \
              "${EXTRA_WEB[@]}"
          fi

      - name: Stage 3b — Build Container & Verify Zero Source-Code Exposure
        if: ${{ inputs.docker_scan }}
        working-directory: caller
        env:
          DOCKER_RUN_ENV: ${{ inputs.docker_run_env }}
          DOCKER_PROBE_PATH: ${{ inputs.docker_probe_path }}
          DOCKER_SENSITIVE_PATHS: ${{ inputs.docker_sensitive_paths }}
        run: |
          trap 'docker rm -f secops-probe >/dev/null 2>&1 || true' EXIT

          ENV_ITEM_RE='^[A-Za-z_][A-Za-z0-9_]*=[A-Za-z0-9_./:@+-]*$'
          PATH_ITEM_RE='^/[A-Za-z0-9_./-]*$'

          if [[ ! "${DOCKER_PROBE_PATH}" =~ ${PATH_ITEM_RE} ]]; then
            echo "::error::docker_probe_path 格式不合法: ${DOCKER_PROBE_PATH}"
            exit 1
          fi

          DOCKER_ENV_ARGS=()
          if [[ -n "${DOCKER_RUN_ENV}" ]]; then
            if [[ "${DOCKER_RUN_ENV}" == *$'\n'* || "${DOCKER_RUN_ENV}" == *$'\r'* || "${DOCKER_RUN_ENV}" == ,* || "${DOCKER_RUN_ENV}" == *, || "${DOCKER_RUN_ENV}" == *,,* ]]; then
              echo "::error::docker_run_env 不得包含換行或空白逗號項目"
              exit 1
            fi
            IFS=',' read -r -a RAW_ENV_ITEMS <<< "${DOCKER_RUN_ENV}"
            for item in "${RAW_ENV_ITEMS[@]}"; do
              if [[ ! "${item}" =~ ${ENV_ITEM_RE} ]]; then
                echo "::error::docker_run_env 項目不合法（僅允許 KEY=VALUE 正向白名單字元）: ${item}"
                exit 1
              fi
              DOCKER_ENV_ARGS+=("-e" "${item}")
            done
          fi

          if [[ -z "${DOCKER_SENSITIVE_PATHS}" || "${DOCKER_SENSITIVE_PATHS}" == *$'\n'* || "${DOCKER_SENSITIVE_PATHS}" == *$'\r'* || "${DOCKER_SENSITIVE_PATHS}" == ,* || "${DOCKER_SENSITIVE_PATHS}" == *, || "${DOCKER_SENSITIVE_PATHS}" == *,,* ]]; then
            echo "::error::docker_sensitive_paths 格式不合法"
            exit 1
          fi
          IFS=',' read -r -a SENSITIVE_PATHS <<< "${DOCKER_SENSITIVE_PATHS}"
          for sp in "${SENSITIVE_PATHS[@]}"; do
            if [[ ! "${sp}" =~ ${PATH_ITEM_RE} ]]; then
              echo "::error::docker_sensitive_paths 路徑不合法: ${sp}"
              exit 1
            fi
          done

          docker build -t secops-candidate:scan .
          docker run -d --name secops-probe -p 18080:8080 -e PORT=8080 ${DOCKER_ENV_ARGS[@]+"${DOCKER_ENV_ARGS[@]}"} secops-candidate:scan

          CODE_ROOT="000"
          for _ in $(seq 1 15); do
            RUNNING=$(docker inspect -f '{{.State.Running}}' secops-probe 2>/dev/null || echo "false")
            if [[ "${RUNNING}" != "true" ]]; then
              echo "::error::容器安全檢測失敗：secops-probe 啟動後即異常終止！"
              docker logs secops-probe || true
              exit 1
            fi
            CODE_ROOT=$(curl -s --connect-timeout 2 --max-time 3 -o /dev/null -w "%{http_code}" "http://127.0.0.1:18080${DOCKER_PROBE_PATH}" || true)
            CODE_ROOT="${CODE_ROOT:-000}"
            if [[ "${CODE_ROOT}" != "000" ]]; then break; fi
            sleep 1
          done

          if [[ ! "${CODE_ROOT}" =~ ^[1-4][0-9]{2}$ ]]; then
            echo "::error::容器安全檢測失敗：探測 ${DOCKER_PROBE_PATH} 回傳異常狀態碼 HTTP ${CODE_ROOT}！"
            docker logs secops-probe || true
            exit 1
          fi
          if [[ "${DOCKER_PROBE_PATH}" != "/" && "${CODE_ROOT}" != "200" ]]; then
            echo "::error::容器安全檢測失敗：自訂健康探測路徑 ${DOCKER_PROBE_PATH} 預期 HTTP 200，實際為 HTTP ${CODE_ROOT}！"
            docker logs secops-probe || true
            exit 1
          fi

          for SENSITIVE in "${SENSITIVE_PATHS[@]}"; do
            SCODE=$(curl -s --connect-timeout 2 --max-time 3 -o /dev/null -w "%{http_code}" "http://127.0.0.1:18080${SENSITIVE}" || true)
            SCODE="${SCODE:-000}"
            if [[ "${SCODE}" == "200" || ! "${SCODE}" =~ ^[1-4][0-9]{2}$ ]]; then
              echo "::error::容器安全檢測失敗：敏感路徑 ${SENSITIVE} 回傳非預期狀態碼 HTTP ${SCODE}！"
              docker logs secops-probe || true
              exit 1
            fi
          done
          echo "[PASS] Container runtime probe passed (${DOCKER_PROBE_PATH} -> HTTP ${CODE_ROOT}; blocked: ${DOCKER_SENSITIVE_PATHS})."

      - name: Stage 3c — Aqua Trivy Container Vulnerability Scan
        if: ${{ inputs.docker_scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "secops-candidate:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "library"
          severity: "CRITICAL"
          cache: true
